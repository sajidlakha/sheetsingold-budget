<!doctype html>
<html lang="en">

<style>
:root{--bg:#0E1624;--bg2:#131E30;--card:#172438;--card2:#1D2C44;--line:#2A3A55;--text:#EDE6D6;--muted:#98A3B5;--gold:#D6B563;--gold2:#B8913F;--goldbg:rgba(214,181,99,.13);
 --green:#6FBF8E;--greenbg:rgba(111,191,142,.14);--red:#E58A74;--redbg:rgba(229,138,116,.14);--blue:#7FA7D9;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px}
[data-theme=ivory]{--bg:#F6F1E6;--bg2:#EFE7D6;--card:#FFFFFF;--card2:#FBF7EF;--line:#E6DCC6;--text:#1B2A41;--muted:#6E7482;--gold:#B8913F;--gold2:#9C7A31;--goldbg:rgba(184,145,63,.12);
 --green:#2F7D55;--greenbg:#E3F1E8;--red:#B5523B;--redbg:#F8E2DA;--blue:#2E5E9E;--shadow:0 10px 28px rgba(27,42,65,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Playfair Display',Georgia,serif}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3F60,#0E1624);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-weight:700;font-size:20px}
.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--card)}.nav.on{background:var(--goldbg);color:var(--gold)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.side .grow{flex:1}
.side .log{margin-top:8px;background:var(--gold);color:#1B2A41;border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:30px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B2A41}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.red{color:var(--red)}
.grid{display:grid;gap:18px}.grid>*,.inl>*{min-width:0}html,body{overflow-x:hidden}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .btn{letter-spacing:0;text-transform:none}
.hero{background:linear-gradient(145deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--goldbg),transparent 70%)}
.label{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:64px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.5px}
.big .cur{font-size:.5em;vertical-align:.65em;margin-right:3px;color:var(--muted)}
.big.neg{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.gold-t{color:var(--gold)}.green-t{color:var(--green)}.red-t{color:var(--red)}
.link{color:var(--gold);cursor:pointer;font-weight:700;background:none;border:0;padding:0;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--gold)}
.bar.green i{background:var(--green)}.bar.red i{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .nm{font-weight:700;font-size:14px}.row .meta{color:var(--muted);font-size:12px;margin-top:2px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.gold{background:var(--goldbg);color:var(--gold)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.grey{background:var(--line);color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qa{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.qa:hover,.qa.on{border-color:var(--gold);color:var(--gold)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--gold)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:block}
.inl{display:flex;gap:10px}.inl>*{flex:1}
.envs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.env{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;background:none}
.env.on{background:var(--gold);color:#1B2A41;border-color:var(--gold)}
.next{display:flex;gap:14px;align-items:center;background:var(--goldbg);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.next .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1B2A41;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 34px}
.kpi .v{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-top:4px}
.kpi .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--muted)}
/* forecast */
.fc{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:6px}
.fc .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.fc .cw{flex:1;width:100%;display:flex;align-items:flex-end}
.fc .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--goldbg);border:1px solid var(--gold);position:relative}
.fc .col.bill{background:var(--redbg);border-color:var(--red)}
.fc .col.pay{background:var(--greenbg);border-color:var(--green)}
.fc .dl{font-size:10px;color:var(--muted);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:1px;padding:4px 0}
.cal .c{min-height:92px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .c.out{opacity:.35}.cal .c.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal .c .dn{font-weight:800;font-size:13px}
.cal .c.pay{background:linear-gradient(180deg,var(--goldbg),var(--card2))}
.cal .ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{background:var(--gold);color:#1B2A41}.ev.b{background:var(--redbg);color:var(--red)}.ev.b.paid{background:var(--greenbg);color:var(--green)}.ev.s{color:var(--muted);background:none;padding:0 5px}
/* ring */
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 74px}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(5,10,18,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:var(--gold2);font-weight:800;cursor:pointer}
/* mobile nav */
.bnav{display:none}
.steps{display:flex;gap:6px;margin:10px 0 4px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--gold)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.focus .hide-focus{display:none!important}
.expl{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13px}
.expl div{display:flex;justify-content:space-between;padding:3px 0}
.expl .t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800}
.star{color:var(--gold)}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.keep{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
 .side{display:none}.main{padding:18px 14px 110px}
 .big{font-size:54px}.top h1{font-size:25px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
 .bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;flex:1}
 .bnav button .ic{font-size:19px}.bnav button.on{color:var(--gold)}
 .bnav .plus{background:var(--gold);color:#1B2A41;border-radius:50%;width:50px;height:50px;flex:0 0 50px;margin-top:-22px;box-shadow:var(--shadow);font-size:26px;font-weight:800;justify-content:center}
 .cal{gap:4px}.cal .c{min-height:58px;padding:4px;border-radius:9px}.cal .h{font-size:9.5px;letter-spacing:0}.card{padding:16px}.g4.keep{gap:12px}.kpi .v{font-size:23px}.cal .ev{font-size:0;height:6px;padding:0}.cal .ev.s{display:none}
}
</style>

<body>
<div class="app" id="app"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   SheetsInGold Budget App  ·  original work by SheetsInGold
   Everything is stored on this device (localStorage). No account.
   ============================================================ */
const EDITION = 'full';            // 'demo' caps logged spends
const DEMO_CAP = 40;
const KEY = 'sig_budget_app_v1';
const CURS = ['$','£','€','¥','₹','₨','kr','zł','R','A$','C$','CHF','₱'];

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const diff = (a,b) => Math.round((pd(a)-pd(b))/864e5);
const dim = (y,m) => new Date(y, m+1, 0).getDate();       // m 0-based
const TODAY = () => ds(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = s => { const d = pd(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const short = s => { const d = pd(s); return d.getDate()+' '+MON[d.getMonth()]; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
let S = load();
let view = 'today', calMonth = null, selEnv = null, qaAmt = null, focus = false;
function blank(){
  return {v:1, name:'', title:'My money plan', cur:'$', theme:'midnight', start:TODAY(), balance:0, balanceDate:TODAY(),
    buffer:0, paychecks:[], bills:[], spends:[], income:[], goals:[], debts:[], debtExtra:[], envelopes:[], notes:{}, payOverride:{},
    debtOrder:'rate', debtExtraMonthly:0, lastOpen:TODAY(), setupDone:false, example:false, quick:[5,10,20,50]};
}
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v) return Object.assign(blank(), s); } catch(e){} return null; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Could not save on this device. Download a backup in Settings.'); } }
const money = (n, dp) => { const neg = n < 0; n = Math.abs(n); const f = (dp===0 || (dp===undefined && n>=1000)) ? n.toLocaleString(undefined,{maximumFractionDigits:0}) : n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'-':'')+S.cur+f; };

/* ---------- recurrence ---------- */
// item: {freq, day, day2, anchor, every, weekendEarly}
function occ(it, from, to){
  const out = []; if (!it || !from || !to || from > to) return out;
  const f = it.freq, F = pd(from), T = pd(to);
  const push = s => { if (s >= from && s <= to) out.push(s); };
  const monthDay = (y,m,d) => ds(new Date(y, m, Math.min(d, dim(y,m)), 12));
  if (f === 'monthly' || f === 'twice' || f === 'semimonthly'){
    const days = f === 'monthly' ? [it.day||1] : [it.day||1, it.day2||15];
    for (let y = F.getFullYear(), m = F.getMonth(); y < T.getFullYear() || (y === T.getFullYear() && m <= T.getMonth()); m++, (m > 11 && (m = 0, y++)))
      days.forEach(d => push(monthDay(y, m, +d)));
  } else if (f === 'weekly' || f === 'biweekly' || f === 'fourweekly'){
    const step = {weekly:7, biweekly:14, fourweekly:28}[f]; if (!it.anchor) return out;
    let k = Math.floor(diff(from, it.anchor)/step); let s = addD(it.anchor, k*step);
    while (s <= to){ push(s); s = addD(s, step); }
  } else if (f === 'months'){
    if (!it.anchor) return out; const a = pd(it.anchor), ev = Math.max(1, +it.every||1), d0 = a.getDate();
    let y = a.getFullYear(), m = a.getMonth();
    const back = Math.max(0, Math.ceil(((F.getFullYear()-y)*12 + F.getMonth()-m)/ev) - 1);
    m += back*ev; y += Math.floor(m/12); m %= 12;
    for (let i = 0; i < 400; i++){ const s = monthDay(y, m, d0); if (s > to) break; push(s); m += ev; y += Math.floor(m/12); m %= 12; }
  } else if (f === 'once'){ if (it.anchor) push(it.anchor); }
  out.sort();
  if (it.weekendEarly) return out.map(s => { const w = pd(s).getDay(); return w === 6 ? addD(s,-1) : w === 0 ? addD(s,-2) : s; });
  return out;
}
const FREQ_BILL = [['monthly','Once a month'],['twice','Two days a month'],['biweekly','Every 2 weeks'],['weekly','Every week'],['months','Every few months'],['once','Just once']];
const FREQ_PAY = [['weekly','Weekly'],['biweekly','Every 2 weeks'],['semimonthly','Twice a month'],['fourweekly','Every 4 weeks'],['monthly','Monthly'],['irregular','Irregular (I log it)']];

/* ---------- derived: paydays, bill occurrences ---------- */
function payOcc(from, to){
  const out = [];
  S.paychecks.forEach(p => { if (p.freq === 'irregular') return; occ(p, from, to).forEach(d => out.push({date:d, p, amount: S.payOverride[p.id+'|'+d] ?? (+p.amount || 0)})); });
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}
function allBills(){
  const debtBills = S.debts.filter(d => d.min > 0 && debtLeft(d) > 0.005).map(d => ({id:'debt:'+d.id, name:d.name+' (minimum)', amount:+d.min, freq:'monthly', day:+d.day||1, category:'Debt', debt:d.id, paid:d.paid||(d.paid={})}));
  return S.bills.concat(debtBills);
}
function billOcc(from, to){
  const out = [];
  allBills().forEach(b => occ(b, from, to).forEach(d => { if (d >= S.start) out.push({date:d, b, amount:+b.amount||0, paid:!!(b.paid && b.paid[d])}); }));
  return out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function nextPayday(t){ const p = payOcc(addD(t,1), addD(t,400)); return p.length ? p[0] : null; }
function debtLeft(d){ const paidMin = Object.keys(d.paid||{}).length * (+d.min||0); const extra = S.debtExtra.filter(x => x.debt === d.id).reduce((a,x) => a + x.amount, 0); return Math.max(0, (+d.balance||0) - paidMin - extra); }
const perMonth = b => b.freq === 'months' ? (+b.amount||0)/Math.max(1,+b.every||1) : 0;

/* ---------- the big number ---------- */
function calc(t = TODAY()){
  const bd = S.balanceDate, np = nextPayday(t);
  const end = np ? addD(np.date, -1) : ds(new Date(pd(t).getFullYear(), pd(t).getMonth()+1, 0, 12));
  const days = Math.max(1, diff(end, t) + 1);
  const since = x => x > bd && x <= t;
  const pays = payOcc(addD(bd,1), t).reduce((a,p) => a + p.amount, 0);
  const inc = S.income.filter(i => since(i.date)).reduce((a,i) => a + i.amount, 0);
  const spent = S.spends.filter(s => since(s.date)).reduce((a,s) => a + s.amount, 0);
  const occs = billOcc(S.start, addD(end, 0));
  const paidOut = billOcc(S.start, addD(t, 400)).filter(o => o.paid && o.date > bd).reduce((a,o) => a + o.amount, 0);
  const extraDebt = S.debtExtra.filter(x => since(x.date)).reduce((a,x) => a + x.amount, 0);
  const now = (+S.balance||0) + pays + inc - spent - paidOut - extraDebt;
  const mustPay = occs.filter(o => !o.paid && !o.b.setAside);
  const owed = mustPay.reduce((a,o) => a + o.amount, 0);
  const setAside = S.bills.filter(b => b.setAside && b.freq === 'months').reduce((a,b) => a + perMonth(b), 0) * days / 30.44;
  const goals = S.goals.filter(g => g.inSafe !== false && (+g.saved||0) < (+g.target||0)).reduce((a,g) => a + (+g.monthly||0), 0) * days / 30.44;
  const buffer = +S.buffer || 0;
  const safe = now - owed - setAside - goals - buffer;
  const spentToday = S.spends.filter(s => s.date === t).reduce((a,s) => a + s.amount, 0);
  const daily = (safe + spentToday) / days;
  return {t, np, end, days, now, pays, inc, spent, paidOut, extraDebt, owed, mustPay, setAside, goals, buffer, safe, spentToday, daily, today: daily - spentToday};
}

/* ---------- render ---------- */

function head(t, sub, right=''){ return `<div class="top hide-focus-not"><div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="chipbar">${right}</div></div>`; }

        <div class="muted small">${money(Math.max(0,c.safe),2)} to last until ${c.np ? 'payday, <b class="gold-t">'+nice(c.np.date)+'</b>' : 'the end of the month'} · ${c.days} day${c.days>1?'s':''}</div>

        <div class="quick">${(S.quick||[5,10,20,50]).map(a => `<button class="qa ${qaAmt===a?'on':''}" data-act="qa" data-v="${a}">+${esc(S.cur)}${a}</button>`).join('')}</div>

        <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn gold" data-act="logNow">Log it</button></div>

function nextThing(c){
  const t = c.t;
  const over = c.mustPay.filter(o => o.date < t);
  const soon = c.mustPay.filter(o => o.date >= t && diff(o.date, t) <= 1);
  let n = null;
  if (!S.paychecks.length) n = ['Add your paycheck so the planner knows when money arrives.', `<button class="btn gold sm" data-go="money">Add paycheck</button>`];
  else if (over.length) n = [`Pay <b>${esc(over[0].b.name)}</b> (${money(over[0].amount)}), it was due ${short(over[0].date)}.`, `<button class="btn gold sm" data-act="payOcc" data-id="${over[0].b.id}" data-d="${over[0].date}">Done, it's paid</button>`];
  else if (soon.length) n = [`<b>${esc(soon[0].b.name)}</b> (${money(soon[0].amount)}) is due ${soon[0].date===t?'today':'tomorrow'}.`, `<button class="btn gold sm" data-act="payOcc" data-id="${soon[0].b.id}" data-d="${soon[0].date}">Mark paid</button>`];
  else if (diff(t, S.balanceDate) >= 7) n = ['Check your bank balance so the number stays true.', `<button class="btn gold sm" data-act="balanceModal">Update balance</button>`];
  else if (!S.spends.some(s => s.date === t)) n = ['Log anything you spent today. Even small things count.', `<button class="btn gold sm" data-act="focusAmt">Log a spend</button>`];
  if (!n) return `<div class="next"><div class="n">✓</div><div class="grow"><b>All done.</b> The rest can wait.</div></div>`;
  return `<div class="next"><div class="n">1</div><div class="grow small">${n[0]}</div>${n[1]}</div>`;
}
function runToPayday(c){
  const days = []; const bills = billOcc(c.t, c.end);
  for (let i = 0; i < Math.min(c.days, 14); i++){ const d = addD(c.t, i); days.push({d, bills: bills.filter(o => o.date === d && !o.paid && !o.b.setAside)}); }
  if (c.np) days.push({d:c.np.date, pay:c.np});
  const mx = Math.max(1, c.daily, ...days.map(x => x.bills ? x.bills.reduce((a,o)=>a+o.amount,0) : 0), c.np ? 0 : 0);
  const left = [];
  let run = c.safe + c.spentToday;
  const bars = days.map((x,i) => {
    if (x.pay) return `<div class="d"><div class="cw"><div class="col pay" style="height:100%"></div></div><div class="dl">💰${short(x.d)}</div></div>`;
    const b = x.bills.reduce((a,o) => a+o.amount, 0); run -= c.daily; left.push(run);
    const h = b ? Math.min(100, 20 + b/mx*80) : Math.max(22, Math.min(100, c.daily/mx*60));
    return `<div class="d" title="${nice(x.d)}${b?' · bills '+money(b):''}"><div class="cw"><div class="col ${b?'bill':''}" style="height:${h}%"></div></div><div class="dl">${i===0?'Today':DOW[pd(x.d).getDay()][0]+pd(x.d).getDate()}</div></div>`;
  }).join('');
  return `<div class="fc">${bars}</div><div class="tiny muted" style="margin-top:8px">Gold = your daily amount (${money(Math.max(0,c.daily),2)}), red = a bill day (already held back), green = payday. ${c.safe < 0 ? '<b class="red-t">You are short before payday. Look at Must-pays to move something.</b>' : 'You are on track if you stay near your daily amount.'}</div>`;
}

/* ---------- MONTH ---------- */
function vMonth(){
  const t = TODAY(); if (!calMonth) calMonth = t.slice(0,7);
  const [y, m] = calMonth.split('-').map(Number), first = `${calMonth}-01`, last = `${calMonth}-${pad(dim(y, m-1))}`;
  const lead = (pd(first).getDay() + 6) % 7, start = addD(first, -lead);
  const pays = payOcc(start, addD(start, 41)), bills = billOcc(addD(start,0), addD(start,41));
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = addD(start, i), inM = d.slice(0,7) === calMonth;
    const p = pays.filter(x => x.date === d), b = bills.filter(x => x.date === d), sp = S.spends.filter(x => x.date === d).reduce((a,x)=>a+x.amount,0);
    cells.push(`<div class="c ${inM?'':'out'} ${d===t?'today':''} ${p.length?'pay':''}" data-act="day" data-d="${d}"><div class="dn">${pd(d).getDate()}</div>
      ${p.map(x => `<div class="ev p">Payday ${money(x.amount,0)}</div>`).join('')}
      ${b.slice(0,2).map(x => `<div class="ev b ${x.paid?'paid':''}">${x.paid?'✓ ':''}${esc(x.b.name)}</div>`).join('')}${b.length>2?`<div class="ev s">+${b.length-2} more</div>`:''}
      ${sp?`<div class="ev s">spent ${money(sp,0)}</div>`:''}</div>`);
  }
  const mp = payOcc(first,last), inc = S.income.filter(i => i.date>=first && i.date<=last);
  const cameIn = mp.reduce((a,p)=>a+p.amount,0) + inc.reduce((a,i)=>a+i.amount,0);
  const mb = billOcc(first,last); const billsOut = mb.reduce((a,o)=>a+o.amount,0);
  const spent = S.spends.filter(s => s.date>=first && s.date<=last).reduce((a,s)=>a+s.amount,0);
  const ext = S.paychecks.length ? extraMonths(y) : [];
  const prev = new Date(y, m-2, 1), nxt = new Date(y, m, 1);
  return `${head(MONL[m-1]+' '+y, 'Paydays in gold, bills on their day, tap any day for details', `<button class="btn" data-act="cal" data-m="${prev.getFullYear()}-${pad(prev.getMonth()+1)}">‹</button><button class="btn" data-act="cal" data-m="${t.slice(0,7)}">This month</button><button class="btn" data-act="cal" data-m="${nxt.getFullYear()}-${pad(nxt.getMonth()+1)}">›</button>`)}
  <div class="grid g4 keep" style="margin-bottom:18px">
    <div class="card kpi"><div class="k">Came in</div><div class="v green-t">${money(cameIn,0)}</div><div class="tiny muted">${mp.length} payday${mp.length===1?'':'s'}${ext.includes(m-1)?' · <span class="star">★ extra paycheck month</span>':''}</div></div>
    <div class="card kpi"><div class="k">Bills</div><div class="v red-t">${money(billsOut,0)}</div><div class="tiny muted">${mb.filter(o=>o.paid).length} of ${mb.length} paid</div></div>
    <div class="card kpi"><div class="k">Spent</div><div class="v">${money(spent,0)}</div><div class="tiny muted">logged spending</div></div>
    <div class="card kpi"><div class="k">Kept</div><div class="v gold-t">${money(cameIn-billsOut-spent,0)}</div><div class="tiny muted">in minus out</div></div>
  </div>
  <div class="card"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(h => `<div class="h">${h}</div>`).join('')}${cells.join('')}</div></div>
  <div class="card" style="margin-top:18px"><h3>Notes for ${MONL[m-1]}</h3><textarea class="inp" id="mnote" rows="3" placeholder="Anything worth remembering about this month. It never changes your numbers.">${esc(S.notes[calMonth]||'')}</textarea><div style="text-align:right;margin-top:8px"><button class="btn sm" data-act="saveNote">Save note</button></div></div>`;
}
function extraMonths(y){
  const p = payOcc(`${y}-01-01`, `${y}-12-31`); const cnt = Array(12).fill(0); p.forEach(x => cnt[pd(x.date).getMonth()]++);
  const base = Math.min(...cnt.filter(n => n > 0)); return cnt.map((n,i) => n > base ? i : -1).filter(i => i >= 0);
}

/* ---------- BILLS ---------- */
function vBills(){

  const monthStart = t.slice(0,8)+'01', monthEnd = t.slice(0,8)+pad(dim(+t.slice(0,4), +t.slice(5,7)-1));
  const mo = billOcc(monthStart, monthEnd), paid = mo.filter(o=>o.paid).reduce((a,o)=>a+o.amount,0), tot = mo.reduce((a,o)=>a+o.amount,0);

    <div class="card kpi"><div class="k">Paid this month</div><div class="v green-t">${money(paid)}</div><div class="bar green" style="margin-top:8px"><i style="width:${tot?paid/tot*100:0}%"></i></div></div>
    <div class="card kpi"><div class="k">Set aside for big bills</div><div class="v gold-t">${money(S.bills.filter(b=>b.setAside).reduce((a,b)=>a+perMonth(b),0))}<span class="small muted"> /month</span></div><div class="tiny muted">yearly and every-few-months costs</div></div>
  </div>

    <div class="card"><h3>Coming up (next 45 days)</h3>${list.length ? list.map(o => billRow(o)).join('') : `<div class="empty">No bills yet. Add rent, phone, streaming and anything that comes round.</div>`}</div>
    <div class="card"><h3>Your bills</h3>${allBills().length ? allBills().map(b => `<div class="row"><div class="grow"><div class="nm">${esc(b.name)}</div><div class="meta">${freqText(b)}${b.category?' · '+esc(b.category):''}</div></div><div class="amt">${money(+b.amount,2)}</div>${b.debt?'<span class="pill grey">from Debt</span>':`<button class="btn sm ghost" data-act="billModal" data-id="${b.id}">Edit</button>`}</div>`).join('') : `<div class="empty">Nothing here yet.</div>`}</div>
  </div>`;
}
function freqText(b){
  const o = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
  switch (b.freq){
    case 'monthly': return 'Monthly on the '+(+b.day>=31?'last day':o(+b.day||1));
    case 'twice': case 'semimonthly': return 'On the '+o(+b.day||1)+' and '+(+b.day2>=31?'last day':o(+b.day2||15));
    case 'weekly': return 'Every week ('+(b.anchor?DOW[pd(b.anchor).getDay()]:'')+')';
    case 'biweekly': return 'Every 2 weeks'+(b.anchor?' from '+short(b.anchor):'');
    case 'fourweekly': return 'Every 4 weeks'+(b.anchor?' from '+short(b.anchor):'');
    case 'months': return 'Every '+(+b.every||1)+' months'+(b.anchor?' from '+short(b.anchor):'')+(b.setAside?' · set aside monthly':'');
    case 'once': return 'Once on '+(b.anchor?nice(b.anchor):'');
    case 'irregular': return 'Irregular, logged by you';
  } return '';
}

/* ---------- DEBT ---------- */
function payoffPlan(extra = +S.debtExtraMonthly || 0){
  let ds_ = S.debts.map(d => ({id:d.id, name:d.name, bal:debtLeft(d), r:(+d.apr||0)/1200, min:+d.min||0})).filter(d => d.bal > 0.005);
  const order = () => ds_.filter(d => d.bal > 0.005).sort((a,b) => S.debtOrder === 'rate' ? b.r - a.r || a.bal - b.bal : a.bal - b.bal || b.r - a.r);
  const pool = ds_.reduce((a,d) => a + d.min, 0) + extra, done = {}; let interest = 0, m = 0;
  while (ds_.some(d => d.bal > 0.005) && m < 600){
    m++; let left = pool;
    ds_.forEach(d => { if (d.bal <= 0.005) return; const i = d.bal*d.r; interest += i; d.bal += i; const p = Math.min(d.bal, d.min); d.bal -= p; left -= p; });
    for (const d of order()){ if (left <= 0) break; const p = Math.min(d.bal, left); d.bal -= p; left -= p; }
    ds_.forEach(d => { if (d.bal <= 0.005 && !done[d.id]) done[d.id] = m; });
    if (pool <= 0) break;
  }
  return {months: m, interest, done, stuck: m >= 600};
}
function vDebt(){

  return `${head('Debt', 'What you owe, the order to pay it, and your debt-free date', `<button class="btn gold" data-act="debtModal">+ Add a debt</button>`)}

  saveGoal(el){ let g = S.goals.find(x => x.id === el.dataset.id); if (!g){ g = {id:uid()}; S.goals.push(g); } g.name = val('f_name')||'Goal'; g.target = num('f_t'); g.saved = num('f_s'); g.monthly = num('f_m'); g.inSafe = document.getElementById('f_in').checked; save(); close(); render(); },
  delGoal(el){ const snap = snapshot(); S.goals = S.goals.filter(x => x.id !== el.dataset.id); save(); close(); render(); toast('Goal removed.', () => restoreSnap(snap)); },
  goalAdd(el){ const g = S.goals.find(x => x.id === el.dataset.id); modal(`<h2>Add to ${esc(g.name)}</h2><label class="lbl">Amount</label><input class="inp" id="m_amt" inputmode="decimal" value="${g.monthly||''}"><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="goalAddSave" data-id="${g.id}">Add</button></div>`); },
  goalAddSave(el){ const g = S.goals.find(x => x.id === el.dataset.id); g.saved = (+g.saved||0) + num('m_amt'); save(); close(); render(); if (g.saved >= g.target) toast('Goal reached. That is a real win. 🎉'); },
  debtModal(el){ const d = el && el.dataset.id ? S.debts.find(x => x.id === el.dataset.id) : {};
    modal(`<h2>${d.id?'Edit debt':'Add a debt'}</h2><label class="lbl">Name</label><input class="inp" id="f_name" value="${esc(d.name||'')}" placeholder="Visa, car loan, student loan">
     <div class="inl"><div><label class="lbl">Balance owed</label><input class="inp" id="f_b" inputmode="decimal" value="${d.balance??''}"></div><div><label class="lbl">Interest rate (APR %)</label><input class="inp" id="f_r" inputmode="decimal" value="${d.apr??''}"></div></div>
     <div class="inl"><div><label class="lbl">Minimum payment</label><input class="inp" id="f_m" inputmode="decimal" value="${d.min??''}"></div><div><label class="lbl">Due day of month</label><input class="inp" id="f_d" inputmode="numeric" value="${d.day??1}"></div></div>
     <div class="acts">${d.id?`<button class="btn red" data-act="delDebt" data-id="${d.id}">Delete</button>`:''}<button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="saveDebt" data-id="${d.id||''}">Save</button></div>`); },
  saveDebt(el){ let d = S.debts.find(x => x.id === el.dataset.id); if (!d){ d = {id:uid(), paid:{}}; S.debts.push(d); } d.name = val('f_name')||'Debt'; d.balance = num('f_b'); d.apr = num('f_r'); d.min = num('f_m'); d.day = Math.max(1,Math.min(31,num('f_d')||1)); save(); close(); render(); },
  delDebt(el){ const snap = snapshot(); S.debts = S.debts.filter(x => x.id !== el.dataset.id); save(); close(); render(); toast('Debt removed.', () => restoreSnap(snap)); },
  debtPay(el){ const d = S.debts.find(x => x.id === el.dataset.id); modal(`<h2>Extra payment · ${esc(d.name)}</h2><div class="muted small">Found some extra and put it on this debt? Record it and the balance comes down.</div><label class="lbl">Amount</label><input class="inp" id="m_amt" inputmode="decimal"><label class="lbl">Date</label><input class="inp" type="date" id="m_date" value="${TODAY()}"><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="debtPaySave" data-id="${d.id}">Record</button></div>`); },
  debtPaySave(el){ const a = num('m_amt'); if (!(a>0)) return; S.debtExtra.push({id:uid(), debt:el.dataset.id, amount:a, date:val('m_date')||TODAY()}); save(); close(); render(); const d = S.debts.find(x=>x.id===el.dataset.id); if (debtLeft(d) <= 0.005) toast(d.name+' is paid off. 🎉'); },
  order(el){ S.debtOrder = el.dataset.v; save(); render(); },
  saveExtra(){ S.debtExtraMonthly = num('dextra'); save(); render(); },
  envModal(el){ const e = el && el.dataset.id ? S.envelopes.find(x => x.id === el.dataset.id) : {};
    modal(`<h2>${e.id?'Edit envelope':'Add an envelope'}</h2><label class="lbl">Name</label><input class="inp" id="f_name" value="${esc(e.name||'')}" placeholder="Groceries"><label class="lbl">Monthly cap</label><input class="inp" id="f_c" inputmode="decimal" value="${e.cap??''}">
     <div class="acts">${e.id?`<button class="btn red" data-act="delEnv" data-id="${e.id}">Delete</button>`:''}<button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="saveEnv" data-id="${e.id||''}">Save</button></div>`); },
  saveEnv(el){ let e = S.envelopes.find(x => x.id === el.dataset.id); if (!e){ e = {id:uid()}; S.envelopes.push(e); } e.name = val('f_name')||'Envelope'; e.cap = num('f_c'); save(); close(); render(); },
  delEnv(el){ const snap = snapshot(); S.envelopes = S.envelopes.filter(x => x.id !== el.dataset.id); save(); close(); render(); toast('Envelope removed. Spends keep their amounts.', () => restoreSnap(snap)); },
  cal(el){ calMonth = el.dataset.m; render(); },
  day(el){ const d = el.dataset.d, p = payOcc(d,d), b = billOcc(d,d), sp = S.spends.filter(s => s.date === d);
    modal(`<h2>${nice(d)}</h2>${p.map(x => `<div class="row"><div class="grow"><div class="nm">💰 ${esc(x.p.name)}</div></div><div class="amt green-t">+${money(x.amount,2)}</div></div>`).join('')}
     ${b.map(o => billRow(o)).join('')}${sp.map(s => spendRow(s)).join('')}${!p.length&&!b.length&&!sp.length?'<div class="muted small" style="padding:12px 0">Nothing on this day.</div>':''}
     <div class="acts"><button class="btn ghost" data-act="close">Close</button></div>`); },
  saveNote(){ S.notes[calMonth] = val('mnote'); save(); toast('Note saved.'); },
  saveSettings(){ S.name = val('s_name'); S.title = val('s_title') || 'My money plan'; S.cur = val('s_cur'); S.theme = val('s_theme'); S.buffer = num('s_buf');
    const q = val('s_quick').split(/[ ,]+/).map(Number).filter(n => n > 0).slice(0,6); if (q.length) S.quick = q; save(); render(); toast('Saved.'); },
  backup(){ const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'}); dl(blob, `budget-backup-${TODAY()}.json`); toast('Backup downloaded. Keep it somewhere safe.'); },
  restore(){ const f = document.getElementById('restoreFile'); f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.v) throw 0; const snap = snapshot(); S = Object.assign(blank(), d); save(); render(); toast('Backup restored.', () => restoreSnap(snap)); } catch(e){ toast('That file is not a planner backup.'); } }; r.readAsText(file); }; f.click(); },
  csv(){ const rows = [['Date','Amount','Envelope','Note']].concat(S.spends.slice().sort((a,b)=>a.date<b.date?-1:1).map(s => [s.date, s.amount, (S.envelopes.find(e=>e.id===s.env)||{}).name||'', s.note||''])); dl(new Blob([rows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')], {type:'text/csv'}), `spending-${TODAY()}.csv`); },
  exampleAgain(){ if (!confirm('Replace your numbers with the example? Download a backup first if you want to keep them.')) return; S = example(); save(); view = 'today'; render(); },
  erase(){ if (!confirm('Erase everything on this device? This cannot be undone unless you have a backup.')) return; localStorage.removeItem(KEY); S = null; onboard(); },
  close(){ close(); }
};
function dl(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function addSpend(amount, note, env, date){
  if (EDITION === 'demo' && S.spends.length >= DEMO_CAP) return toast(`The demo holds ${DEMO_CAP} spends. Everything you typed stays readable.`);
  const s = {id:uid(), amount:Math.round(amount*100)/100, note:note||'', env:env||null, date:date||TODAY()};
  S.spends.push(s); save(); render(); toast(`${money(s.amount,2)} logged.`, () => { S.spends = S.spends.filter(x => x.id !== s.id); save(); render(); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ const v = g.dataset.go; if (v === 'more') return moreSheet(); view = v; close(); focus = false; render(); window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]'); if (a && A[a.dataset.act]) { e.preventDefault(); A[a.dataset.act](a); }
});
document.getElementById('mask').addEventListener('click', e => { if (e.target.id === 'mask') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && e.target.id === 'amt') A.logNow(); if (e.key === 'Enter' && e.target.id === 'note') A.logNow(); });
function moreSheet(){ modal(`<h2>More</h2>${NAV.slice(3).map(n => `<button class="nav" data-go="${n[0]}" style="margin-top:4px"><span class="ic">${n[2]}</span>${n[1]}</button>`).join('')}`); }

/* ---------- example + onboarding ---------- */
function example(){
  const t = TODAY(), s = blank(); s.example = true; s.setupDone = true; s.name = 'Sam'; s.title = 'My calm money plan'; s.start = addD(t, -40);
  const lastFri = (() => { let d = t; while (pd(d).getDay() !== 5) d = addD(d, -1); return d; })();
  s.paychecks = [{id:'p1', name:'Main wage', amount:1850, freq:'biweekly', anchor:lastFri, weekendEarly:true}];
  s.balance = 1325.40; s.balanceDate = addD(t, -2); s.buffer = 100;
  const m = (name, amount, day, cat, extra={}) => Object.assign({id:uid(), name, amount, freq:'monthly', day, category:cat, paid:{}}, extra);
  s.bills = [m('Rent',1150,1,'Home'), m('Phone',45,12,'Phone'), m('Internet',55,18,'Home'), m('Electric',85,22,'Home'), m('Streaming',16,9,'Fun'), m('Gym',30,4,'Health'),
    Object.assign(m('Car insurance',372,1,'Car'), {freq:'months', every:6, anchor:addD(t, 50), setAside:true})];
  // tick everything already due
  s.bills.forEach(b => occ(b, s.start, addD(t,-1)).forEach(d => b.paid[d] = true));
  s.envelopes = [{id:'e1',name:'Groceries',cap:420},{id:'e2',name:'Fuel',cap:160},{id:'e3',name:'Eating out',cap:120},{id:'e4',name:'Fun money',cap:80}];
  s.goals = [{id:'g1',name:'Emergency fund',target:3000,saved:1240,monthly:150,inSafe:true},{id:'g2',name:'Summer trip',target:1200,saved:380,monthly:100,inSafe:true}];
  s.debts = [{id:'d1',name:'Visa card',balance:2400,apr:22.9,min:65,day:20,paid:{}},{id:'d2',name:'Car loan',balance:6900,apr:7.4,min:210,day:6,paid:{}}];
  s.debts.forEach(d => occ({freq:'monthly', day:d.day}, s.start, addD(t,-1)).forEach(x => d.paid[x] = true));
  const notes = [['Supermarket','e1'],['Coffee','e3'],['Fuel','e2'],['Lunch out','e3'],['Market','e1'],['Cinema','e4']];
  for (let i = 12; i >= 0; i--) { const d = addD(t, -i); const n = i === 0 ? 2 : 1 + (i % 2); for (let k = 0; k < n; k++){ const [note, env] = notes[(i*3+k) % notes.length]; const base = {e1:31,e2:27,e3:8,e4:12}[env]; s.spends.push({id:uid(), date:d, amount:Math.round(base*(0.7+((i*7+k*3)%10)/12)*100)/100, note, env}); } }
  s.income = [{id:uid(), date:addD(t,-5), amount:60, note:'Refund'}];
  s.debtExtraMonthly = 50; s.lastOpenPrev = t; return s;
}
function onboard(step = 0, draft = {}){
  const steps = [
    () => `<h2>Welcome</h2><div class="muted small">A calm budget that tells you one thing: what is safe to spend today. It is saved on this device only. No account, no bank connection.</div>
      <div class="acts" style="justify-content:stretch;flex-direction:column"><button class="btn gold" data-ob="example">Explore with example numbers first</button><button class="btn" data-ob="fresh">Start with my own numbers</button><button class="btn ghost" data-ob="restore">I have a backup file</button></div>`,
    () => `<div class="steps"><i class="on"></i><i></i><i></i><i></i></div><h2>What is in your account?</h2><div class="muted small">Open your banking app and type the balance of the account you spend from.</div><label class="lbl">Balance today</label><input class="inp" id="o_bal" inputmode="decimal"><label class="lbl">Currency</label><select class="inp" id="o_cur">${CURS.map(c=>`<option>${c}</option>`).join('')}</select><div class="acts"><button class="btn gold" data-ob="n1">Next</button></div>`,
    () => `<div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div><h2>Your paycheck</h2><div class="muted small">What usually reaches your account, and how often. You can add more paychecks later.</div><label class="lbl">Amount</label><input class="inp" id="f_amt" inputmode="decimal">${freqFields({freq:'biweekly'},true)}<div class="acts"><button class="btn ghost" data-ob="skip2">I am paid irregularly</button><button class="btn gold" data-ob="n2">Next</button></div>`,
    () => `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div><h2>Check your next payday</h2><div class="small" style="margin:12px 0">${(() => { const p = S.paychecks[0]; const n = p ? occ(p, addD(TODAY(),1), addD(TODAY(),120))[0] : null; return n ? 'Your next payday looks like <b class="gold-t">'+nice(n)+'</b>. If that is wrong, go back and change the date.' : 'No payday set. The planner will count to the end of each month.'; })()}</div><div class="acts"><button class="btn ghost" data-ob="back2">Back</button><button class="btn gold" data-ob="n3">Looks right</button></div>`,
    () => `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><h2>Your first bill</h2><div class="muted small">Start with the biggest one, like rent. Add the rest any time.</div><label class="lbl">Name</label><input class="inp" id="f_name" placeholder="Rent"><label class="lbl">Amount</label><input class="inp" id="f_bamt" inputmode="decimal"><label class="lbl">Day of the month it goes out</label><input class="inp" id="f_bday" inputmode="numeric" value="1"><div class="acts"><button class="btn ghost" data-ob="done">Skip for now</button><button class="btn gold" data-ob="n4">Finish</button></div>`
  ];
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="brand" style="position:fixed;top:18px;left:22px"><div class="lg">S</div><div><b>SheetsInGold</b><small>Budget App</small></div></div></div>`;
  modal(steps[step]()); if (step === 2) freqShow();
  document.getElementById('modal').onclick = e => { const b = e.target.closest('[data-ob]'); if (!b) return; const o = b.dataset.ob;
    if (o === 'example'){ S = example(); save(); close(); render(); toast('These are made-up numbers. Start your own file in Settings any time.'); }
    else if (o === 'fresh'){ S = blank(); onboard(1); }
    else if (o === 'restore'){ S = blank(); render(); view = 'settings'; render(); close(); A.restore(); }
    else if (o === 'n1'){ S.balance = num('o_bal'); S.cur = val('o_cur'); S.balanceDate = TODAY(); S.start = TODAY(); save(); onboard(2); }
    else if (o === 'n2'){ const p = readFreq({id:uid(), name:'My paycheck', amount:num('f_amt')}); S.paychecks = [p]; save(); onboard(3); }
    else if (o === 'skip2'){ S.paychecks = [{id:uid(), name:'Irregular income', freq:'irregular', amount:0}]; save(); onboard(3); }
    else if (o === 'back2'){ onboard(2); }
    else if (o === 'n3'){ onboard(4); }
    else if (o === 'n4' || o === 'done'){ if (o === 'n4' && val('f_name')) S.bills.push({id:uid(), name:val('f_name'), amount:num('f_bamt'), freq:'monthly', day:Math.max(1,Math.min(31,num('f_bday')||1)), paid:{}});
      S.setupDone = true; S.lastOpenPrev = TODAY(); save(); close(); document.getElementById('modal').onclick = null; view = 'today'; render(); toast('You are set. This is your safe to spend.'); }
  };
}

/* ---------- boot ---------- */
const QS = new URLSearchParams(location.search);
if (QS.has('example') && (!S || !S.setupDone)) { S = example(); if (QS.get('theme')) S.theme = QS.get('theme'); save(); }   // never overwrites a real planner
if (QS.get('view')) view = QS.get('view');
if (!S || !S.setupDone) onboard();
else { S.lastOpenPrev = S.lastOpen || TODAY(); S.lastOpen = TODAY(); save(); render(); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
