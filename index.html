:root{--onacc:#1B2A41;--bg:#0E1624;--bg2:#131E30;--card:#172438;--card2:#1D2C44;--line:#2A3A55;--text:#EDE6D6;--muted:#98A3B5;--gold:#D6B563;--gold2:#B8913F;--goldbg:rgba(214,181,99,.13);
 --green:#6FBF8E;--greenbg:rgba(111,191,142,.14);--red:#E58A74;--redbg:rgba(229,138,116,.14);--blue:#7FA7D9;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px}
[data-theme=rose]{--onacc:#fff;--bg:#FBF3F1;--bg2:#F6E7E3;--card:#FFFFFF;--card2:#FDF7F5;--line:#EFD9D3;--text:#4A1F2C;--muted:#8A6F74;--gold:#B86B5A;--gold2:#9C5646;--goldbg:rgba(184,107,90,.12);
 --green:#3F7F5E;--greenbg:#E2F0E7;--red:#B8434A;--redbg:#F8DEDF;--blue:#6A5A9E;--shadow:0 10px 28px rgba(74,31,44,.08)}
[data-theme=sage]{--onacc:#fff;--bg:#F1F4EE;--bg2:#E5EBE1;--card:#FFFFFF;--card2:#F7F9F4;--line:#D9E3D4;--text:#1F3A33;--muted:#687A71;--gold:#4E8B6E;--gold2:#3D7359;--goldbg:rgba(78,139,110,.12);
 --green:#2F7D55;--greenbg:#E1F0E6;--red:#B5523B;--redbg:#F6E0D8;--blue:#3D6E8C;--shadow:0 10px 28px rgba(31,58,51,.08)}
[data-theme=lavender]{--onacc:#fff;--bg:#F5F2FB;--bg2:#ECE6F8;--card:#FFFFFF;--card2:#FAF8FE;--line:#E3DCF2;--text:#2E2750;--muted:#77719A;--gold:#7C63C9;--gold2:#6550AE;--goldbg:rgba(124,99,201,.12);
 --green:#3B8C69;--greenbg:#E1F2EA;--red:#C24E67;--redbg:#F9E0E6;--blue:#4F7CC9;--shadow:0 10px 28px rgba(46,39,80,.09)}
[data-theme=ocean]{--onacc:#07262B;--bg:#08171C;--bg2:#0C2128;--card:#102C35;--card2:#153641;--line:#224A56;--text:#E2F1F1;--muted:#8DB0B4;--gold:#5CC6BE;--gold2:#3FA9A1;--goldbg:rgba(92,198,190,.13);
 --green:#7DD3A1;--greenbg:rgba(125,211,161,.14);--red:#F29078;--redbg:rgba(242,144,120,.14);--blue:#8FB8F0;--shadow:0 10px 30px rgba(0,0,0,.38)}
[data-theme=ivory]{--onacc:#fff;--bg:#F6F1E6;--bg2:#EFE7D6;--card:#FFFFFF;--card2:#FBF7EF;--line:#E6DCC6;--text:#1B2A41;--muted:#6E7482;--gold:#B8913F;--gold2:#9C7A31;--goldbg:rgba(184,145,63,.12);
 --green:#2F7D55;--greenbg:#E3F1E8;--red:#B5523B;--redbg:#F8E2DA;--blue:#2E5E9E;--shadow:0 10px 28px rgba(27,42,65,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Playfair Display',Georgia,serif}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3F60,#0E1624);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-weight:700;font-size:20px}
.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--card)}.nav.on{background:var(--goldbg);color:var(--gold)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.side .grow{flex:1}
.side .log{margin-top:8px;background:var(--gold);color:var(--onacc);border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:30px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onacc)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.red{color:var(--red)}
.grid{display:grid;gap:18px}.grid>*,.inl>*{min-width:0}html,body{overflow-x:hidden}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .btn{letter-spacing:0;text-transform:none}
.hero{background:linear-gradient(145deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--goldbg),transparent 70%)}
.label{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:64px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.5px}
.big .cur{font-size:.5em;vertical-align:.65em;margin-right:3px;color:var(--muted)}
.big.neg{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.gold-t{color:var(--gold)}.green-t{color:var(--green)}.red-t{color:var(--red)}
.link{color:var(--gold);cursor:pointer;font-weight:700;background:none;border:0;padding:0;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--gold)}
.bar.green i{background:var(--green)}.bar.red i{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .nm{font-weight:700;font-size:14px}.row .meta{color:var(--muted);font-size:12px;margin-top:2px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.gold{background:var(--goldbg);color:var(--gold)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.grey{background:var(--line);color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qa{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.qa:hover,.qa.on{border-color:var(--gold);color:var(--gold)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--gold)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:block}
.inl{display:flex;gap:10px}.inl>*{flex:1}
.envs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.env{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;background:none}
.env.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.next{display:flex;gap:14px;align-items:center;background:var(--goldbg);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.next .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 34px}
.kpi .v{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-top:4px}
.kpi .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--muted)}
/* forecast */
.fc{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:6px}
.fc .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.fc .cw{flex:1;width:100%;display:flex;align-items:flex-end}
.fc .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--goldbg);border:1px solid var(--gold);position:relative}
.fc .col.bill{background:var(--redbg);border-color:var(--red)}
.fc .col.pay{background:var(--greenbg);border-color:var(--green)}
.fc .dl{font-size:10px;color:var(--muted);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:1px;padding:4px 0}
.cal .c{min-height:92px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .c.out{opacity:.35}.cal .c.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal .c .dn{font-weight:800;font-size:13px}
.cal .c.pay{background:linear-gradient(180deg,var(--goldbg),var(--card2))}
.cal .ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{background:var(--gold);color:var(--onacc)}.ev.b{background:var(--redbg);color:var(--red)}.ev.b.paid{background:var(--greenbg);color:var(--green)}.ev.s{color:var(--muted);background:none;padding:0 5px}
/* ring */
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 74px}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(5,10,18,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:var(--gold2);font-weight:800;cursor:pointer}
/* mobile nav */
.bnav{display:none}

<script>

const EDITION = 'full';            // 'demo' caps logged spends
const DEMO_CAP = 40;
const KEY = 'sig_budget_app_v1';
const CURS = ['$','£','€','¥','₹','₨','kr','zł','R','A$','C$','CHF','₱'];

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const diff = (a,b) => Math.round((pd(a)-pd(b))/864e5);
const dim = (y,m) => new Date(y, m+1, 0).getDate();       // m 0-based
const TODAY = () => ds(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = s => { const d = pd(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const short = s => { const d = pd(s); return d.getDate()+' '+MON[d.getMonth()]; };
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
/* ---------- people on this device + encryption ---------- */
const REG = 'sig_people_v1';
let people = loadPeople(), cryptoKey = null;
function loadPeople(){
  try { const r = JSON.parse(localStorage.getItem(REG)); if (r && Array.isArray(r.list) && r.list.length && r.list.every(x => x && x.id)) { if (!r.list.some(x => x.id === r.active)) r.active = r.list[0].id; return r; } } catch(e){}
  let name = ''; try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.name) name = String(d.name).slice(0,40); } catch(e){}
  const r = {active:'p1', list:[{id:'p1', name, color:'', locked:false}]}; try { localStorage.setItem(REG, JSON.stringify(r)); } catch(e){} return r;
}
const savePeople = () => { try { localStorage.setItem(REG, JSON.stringify(people)); } catch(e){} };
const keyFor = id => id === 'p1' ? KEY : KEY + ':' + id;
const me = () => people.list.find(x => x.id === people.active) || people.list[0];
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(salt), iterations:210000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, key, salt){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text)); return JSON.stringify({enc:1, kind:'sig-budget', salt, iv:b64(iv), ct:b64(ct)}); }
async function decryptText(blob, key){ const o = typeof blob === 'string' ? JSON.parse(blob) : blob; const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct)); return new TextDecoder().decode(pt); }
const isEncrypted = raw => { try { const o = JSON.parse(raw); return !!(o && o.enc === 1 && o.ct); } catch(e){ return false; } };
let S = load();
let view = 'today', calMonth = null, selEnv = null, qaAmt = null, focus = false;
function blank(){
  return {v:1, name:'', title:'My money plan', cur:'$', theme:'midnight', start:TODAY(), balance:0, balanceDate:TODAY(),
    buffer:0, paychecks:[], bills:[], spends:[], income:[], goals:[], debts:[], debtExtra:[], envelopes:[], notes:{}, payOverride:{},
    debtOrder:'rate', debtExtraMonthly:0, lastOpen:TODAY(), setupDone:false, example:false, quick:[5,10,20,50], dump:[], wins:[], mdate:{}, accounts:[], profile:{goal:'', household:'', week:'Monday', privacy:false, calm:false, color:'', avatar:'', bio:''}};
}
function clean(d){ const b = blank(), o = Object.assign(b, d);
  ['paychecks','bills','spends','income','goals','debts','debtExtra','envelopes','dump','wins','accounts'].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  if (!['md','lg','xl'].includes(o.profile && o.profile.size)) { if (o.profile) o.profile.size = 'md'; }
  ['notes','payOverride','mdate'].forEach(k => { if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) o[k] = {}; });
  o.profile = Object.assign(blank().profile, o.profile && typeof o.profile === 'object' ? o.profile : {});
  if (o.profile.avatar && !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(o.profile.avatar)) o.profile.avatar = '';
  if (o.profile.color && !/^#[0-9A-Fa-f]{6}$/.test(o.profile.color)) o.profile.color = '';
  if (!CURS.includes(o.cur)) o.cur = '$';
  ['balance','buffer','debtExtraMonthly'].forEach(k => { o[k] = +o[k] || 0; });
  ['start','balanceDate'].forEach(k => { if (!/^\d{4}-\d{2}-\d{2}$/.test(o[k]||'')) o[k] = TODAY(); });
  o.spends = o.spends.filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && isFinite(+x.amount)).map(x => (x.amount = +x.amount, x));
  return o; }
function load(){ try { const raw = localStorage.getItem(keyFor(people.active)); if (!raw || isEncrypted(raw)) return null; const s = JSON.parse(raw); if (s && s.v) return clean(s); } catch(e){} return null; }
let saveSeq = 0;
function save(quiet){
  if (!S) return; const who = people.active, m = me(), data = JSON.stringify(S);
  if (m.name !== (S.name||'') || m.color !== ((S.profile||{}).color||'')) { m.name = String(S.name||'').slice(0,40); m.color = (S.profile||{}).color || ''; savePeople(); }
  const fail = () => toast('Could not save on this device. Download a backup in Settings.');
  if (m.locked) { if (!cryptoKey) return; const seq = ++saveSeq, key = cryptoKey, salt = m.salt;
    encryptText(data, key, salt).then(blob => { if (seq !== saveSeq || who !== people.active) return; try { localStorage.setItem(keyFor(who), blob); } catch(e){ fail(); } }); }
  else { try { localStorage.setItem(keyFor(who), data); } catch(e){ fail(); } }
  if (!quiet) autoBackupSoon();
}
const money = (n, dp) => { const neg = n < 0; n = Math.abs(n); const f = (dp===0 || (dp===undefined && n>=1000)) ? n.toLocaleString(undefined,{maximumFractionDigits:0}) : n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?'-':'')+S.cur+f; };

/* ---------- recurrence ---------- */
// item: {freq, day, day2, anchor, every, weekendEarly}
function occ(it, from, to){
  const out = []; if (!it || !from || !to || from > to) return out;
  const f = it.freq, F = pd(from), T = pd(to);
  const push = s => { if (s >= from && s <= to) out.push(s); };
  const monthDay = (y,m,d) => ds(new Date(y, m, Math.min(d, dim(y,m)), 12));
  if (f === 'monthly' || f === 'twice' || f === 'semimonthly'){
    const days = f === 'monthly' ? [it.day||1] : [it.day||1, it.day2||15];
    for (let y = F.getFullYear(), m = F.getMonth(); y < T.getFullYear() || (y === T.getFullYear() && m <= T.getMonth()); m++, (m > 11 && (m = 0, y++)))
      days.forEach(d => push(monthDay(y, m, +d)));
  } else if (f === 'weekly' || f === 'biweekly' || f === 'fourweekly'){
    const step = {weekly:7, biweekly:14, fourweekly:28}[f]; if (!it.anchor) return out;
    let k = Math.floor(diff(from, it.anchor)/step); let s = addD(it.anchor, k*step);
    while (s <= to){ push(s); s = addD(s, step); }
  } else if (f === 'months'){
    if (!it.anchor) return out; const a = pd(it.anchor), ev = Math.max(1, +it.every||1), d0 = a.getDate();
    let y = a.getFullYear(), m = a.getMonth();
    const back = Math.max(0, Math.ceil(((F.getFullYear()-y)*12 + F.getMonth()-m)/ev) - 1);
    m += back*ev; y += Math.floor(m/12); m %= 12;
    for (let i = 0; i < 400; i++){ const s = monthDay(y, m, d0); if (s > to) break; push(s); m += ev; y += Math.floor(m/12); m %= 12; }
  } else if (f === 'once'){ if (it.anchor) push(it.anchor); }
  out.sort();
  if (it.weekendEarly) return out.map(s => { const w = pd(s).getDay(); return w === 6 ? addD(s,-1) : w === 0 ? addD(s,-2) : s; });
  return out;
}
const FREQ_BILL = [['monthly','Once a month'],['twice','Two days a month'],['biweekly','Every 2 weeks'],['weekly','Every week'],['months','Every few months'],['once','Just once']];
const FREQ_PAY = [['weekly','Weekly'],['biweekly','Every 2 weeks'],['semimonthly','Twice a month'],['fourweekly','Every 4 weeks'],['monthly','Monthly'],['irregular','Irregular (I log it)']];

/* ---------- derived: paydays, bill occurrences ---------- */
function payOcc(from, to){
  const out = [];
  S.paychecks.forEach(p => { if (p.freq === 'irregular') return; const keep = 1 - Math.min(100, Math.max(0, +p.savePct || 0)) / 100;
    occ(p, from, to).forEach(d => { const gross = S.payOverride[p.id+'|'+d] ?? (+p.amount || 0); out.push({date:d, p, gross, saved: gross * (1 - keep), amount: gross * keep}); }); });
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}
function allBills(){
  const debtBills = S.debts.filter(d => d.min > 0 && debtLeft(d) > 0.005).map(d => ({id:'debt:'+d.id, name:d.name+' (minimum)', amount:+d.min, freq:'monthly', day:+d.day||1, category:'Debt', debt:d.id, paid:d.paid||(d.paid={})}));
  return S.bills.concat(debtBills);
}
function billOcc(from, to){
  const out = [];
  allBills().forEach(b => occ(b, from, to).forEach(d => { if (d >= S.start) out.push({date:d, b, amount:+b.amount||0, paid:!!(b.paid && b.paid[d])}); }));
  return out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

function nextThing(c){
  const t = c.t;
  const over = c.mustPay.filter(o => o.date < t);
  const soon = c.mustPay.filter(o => o.date >= t && diff(o.date, t) <= 1);
  let n = null;
  if (!S.paychecks.length) n = ['Add your paycheck so the planner knows when money arrives.', `<button class="btn gold sm" data-go="money">Add paycheck</button>`];
  else if (over.length) n = [`Pay <b>${esc(over[0].b.name)}</b> (${money(over[0].amount)}), it was due ${short(over[0].date)}.`, `<button class="btn gold sm" data-act="payOcc" data-id="${over[0].b.id}" data-d="${over[0].date}">Done, it's paid</button>`];
  else if (soon.length) n = [`<b>${esc(soon[0].b.name)}</b> (${money(soon[0].amount)}) is due ${soon[0].date===t?'today':'tomorrow'}.`, `<button class="btn gold sm" data-act="payOcc" data-id="${soon[0].b.id}" data-d="${soon[0].date}">Mark paid</button>`];
  else if (diff(t, S.balanceDate) >= 7) n = ['Check your bank balance so the number stays true.', `<button class="btn gold sm" data-act="balanceModal">Update balance</button>`];
  else if (!S.spends.some(s => s.date === t)) n = ['Log anything you spent today. Even small things count.', `<button class="btn gold sm" data-act="focusAmt">Log a spend</button>`];
  const g = (S.profile||{}).goal, tips = TIPS[g] || TIPS.track, tip = tips[pd(t).getDate() % tips.length];
  if (!n) return `<div class="next"><div class="n">✓</div><div class="grow"><b>All done.</b> The rest can wait.</div></div><div class="tip">${ico('spark')}<div><b>For your goal${g?': '+esc((GOALS_MAIN.find(x=>x[0]===g)||['',''])[1].toLowerCase()):''}</b><br>${tip}</div></div>`;
  return `<div class="next"><div class="n">1</div><div class="grow small">${n[0]}</div>${n[1]}</div>`;
}
function runToPayday(c){
  const days = []; const bills = billOcc(c.t, c.end);
  for (let i = 0; i < Math.min(c.days, 14); i++){ const d = addD(c.t, i); days.push({d, bills: bills.filter(o => o.date === d && !o.paid && !o.b.setAside)}); }
  if (c.np) days.push({d:c.np.date, pay:c.np});
  const mx = Math.max(1, c.daily, ...days.map(x => x.bills ? x.bills.reduce((a,o)=>a+o.amount,0) : 0), c.np ? 0 : 0);
  const left = [];
  let run = c.safe + c.spentToday;
  const bars = days.map((x,i) => {
    if (x.pay) return `<div class="d"><div class="cw"><div class="col pay" style="height:100%"></div></div><div class="dl">💰<br>${short(x.d)}</div></div>`;
    const b = x.bills.reduce((a,o) => a+o.amount, 0); run -= c.daily; left.push(run);
    const h = b ? Math.min(100, 20 + b/mx*80) : Math.max(22, Math.min(100, c.daily/mx*60));
    return `<div class="d" title="${nice(x.d)}${b?' · bills '+money(b):''}"><div class="cw"><div class="col ${b?'bill':''}" style="height:${h}%"></div></div><div class="dl">${i===0?'Today':DOW[pd(x.d).getDay()]+'<br>'+pd(x.d).getDate()}</div></div>`;
  }).join('');
  return `<div class="fc">${bars}</div><div class="tiny muted" style="margin-top:8px">Each bar is one day. 🟨 = what you can spend that day (${money(Math.max(0,c.daily),2)}). 🟥 = a bill is due (the money is already kept aside). 🟩 = payday. ${c.safe < 0 ? '<b class="red-t">You will be short before payday. Open Bills to move something.</b>' : 'Stay close to your daily amount and you are on track. 👍'}</div>`;
}

  const [y, m] = calMonth.split('-').map(Number), first = `${calMonth}-01`, last = `${calMonth}-${pad(dim(y, m-1))}`;
  const lead = sunFirst() ? pd(first).getDay() : (pd(first).getDay() + 6) % 7, start = addD(first, -lead);
  const pays = payOcc(start, addD(start, 41)), bills = billOcc(addD(start,0), addD(start,41));
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = addD(start, i), inM = d.slice(0,7) === calMonth;
    const p = pays.filter(x => x.date === d), b = bills.filter(x => x.date === d), sp = S.spends.filter(x => x.date === d).reduce((a,x)=>a+x.amount,0);
    cells.push(`<div class="c ${inM?'':'out'} ${d===t?'today':''} ${p.length?'pay':''}" data-act="day" data-d="${d}"><div class="dn">${pd(d).getDate()}</div>
      ${p.map(x => `<div class="ev p">Payday ${money(x.amount,0)}</div>`).join('')}
      ${b.slice(0,2).map(x => `<div class="ev b ${x.paid?'paid':''}">${x.paid?'✓ ':''}${esc(x.b.name)}</div>`).join('')}${b.length>2?`<div class="ev s">+${b.length-2} more</div>`:''}
      ${sp?`<div class="ev s">spent ${money(sp,0)}</div>`:''}</div>`);
  }
  const mp = payOcc(first,last), inc = S.income.filter(i => i.date>=first && i.date<=last);
  const cameIn = mp.reduce((a,p)=>a+p.amount,0) + inc.reduce((a,i)=>a+i.amount,0);
  const mb = billOcc(first,last); const billsOut = mb.reduce((a,o)=>a+o.amount,0);
  const spent = S.spends.filter(s => s.date>=first && s.date<=last).reduce((a,s)=>a+s.amount,0);
  const ext = S.paychecks.length ? extraMonths(y) : [];
  const prev = new Date(y, m-2, 1), nxt = new Date(y, m, 1);
  return `${head('🗓️ '+MONL[m-1]+' '+y, 'Paydays in gold, bills on their day. Tap any day to see more.', `<button class="btn" data-act="cal" data-m="${prev.getFullYear()}-${pad(prev.getMonth()+1)}">‹</button><button class="btn" data-act="cal" data-m="${t.slice(0,7)}">This month</button><button class="btn" data-act="cal" data-m="${nxt.getFullYear()}-${pad(nxt.getMonth()+1)}">›</button>`)}
  <div class="grid g4 keep" style="margin-bottom:18px">
    <div class="card kpi"><div class="k">💵 Money in</div><div class="v green-t">${money(cameIn,0)}</div><div class="tiny muted">${mp.length} payday${mp.length===1?'':'s'}${ext.includes(m-1)?' · <span class="star">★ extra paycheck month</span>':''}</div></div>
    <div class="card kpi"><div class="k">🧾 Bills</div><div class="v red-t">${money(billsOut,0)}</div><div class="tiny muted">${mb.filter(o=>o.paid).length} of ${mb.length} paid</div></div>
    <div class="card kpi"><div class="k">🛒 Spent</div><div class="v">${money(spent,0)}</div><div class="tiny muted">what you logged</div></div>
    <div class="card kpi"><div class="k">💚 Left over</div><div class="v gold-t">${money(cameIn-billsOut-spent,0)}</div><div class="tiny muted">money in minus money out</div></div>
  </div>
  <div class="card"><div class="cal">${(sunFirst()?['Sun','Mon','Tue','Wed','Thu','Fri','Sat']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(h => `<div class="h">${h}</div>`).join('')}${cells.join('')}</div></div>
  <div class="grid g2" style="margin-top:18px"><div class="card"><h3>🍩 Where this month's spending went</h3>${(() => { const items = S.envelopes.map(e => ({l:e.name, v:S.spends.filter(s => s.env===e.id && s.date>=first && s.date<=last).reduce((a,s)=>a+s.amount,0)}));
      const other = S.spends.filter(s => !s.env && s.date>=first && s.date<=last).reduce((a,s)=>a+s.amount,0); if (other) items.push({l:'No limit set', v:other}); return donut(items, money(spent,0), 'spent') || illus('envelopes','Log a few spends with a category and this chart fills in.'); })()}</div>
   <div class="card"><h3>⚖️ Money in vs out</h3>${donut([{l:'Bills', v:billsOut, c:'var(--red)'},{l:'Spending', v:spent, c:'var(--gold)'},{l:'Left over', v:Math.max(0,cameIn-billsOut-spent), c:'var(--green)'}], money(cameIn,0), 'money in') || illus('money','Add a paycheck to see this.')}</div></div>
  <div class="card" style="margin-top:18px"><h3>Notes for ${MONL[m-1]}</h3><textarea class="inp" id="mnote" rows="3" placeholder="Anything worth remembering about this month. It never changes your numbers.">${esc(S.notes[calMonth]||'')}</textarea><div style="text-align:right;margin-top:8px"><button class="btn sm" data-act="saveNote">Save note</button></div></div>`;
}
function extraMonths(y){
  const p = payOcc(`${y}-01-01`, `${y}-12-31`); const cnt = Array(12).fill(0); p.forEach(x => cnt[pd(x.date).getMonth()]++);
  const base = Math.min(...cnt.filter(n => n > 0)); return cnt.map((n,i) => n > base ? i : -1).filter(i => i >= 0);
}

function vBills(){
  const t = TODAY(), c = calc(), until = addD(t, 45);
  const list = billOcc(addD(t,-30), until).filter(o => o.date >= t || !o.paid);
  const monthStart = t.slice(0,8)+'01', monthEnd = t.slice(0,8)+pad(dim(+t.slice(0,4), +t.slice(5,7)-1));
  const mo = billOcc(monthStart, monthEnd), paid = mo.filter(o=>o.paid).reduce((a,o)=>a+o.amount,0), tot = mo.reduce((a,o)=>a+o.amount,0);

    <div class="card kpi"><div class="k">✅ Paid this month</div><div class="v green-t">${money(paid)}</div><div class="bar green" style="margin-top:8px"><i style="width:${tot?paid/tot*100:0}%"></i></div></div>
    <div class="card kpi"><div class="k">🗓️ Saving for big bills</div><div class="v gold-t">${money(S.bills.filter(b=>b.setAside).reduce((a,b)=>a+perMonth(b),0))}<span class="small muted"> /month</span></div><div class="tiny muted">bills that come once or twice a year</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>⏰ Coming up (next 45 days)</h3>${list.length ? list.map(o => billRow(o)).join('') : illus('bills','No bills yet. Add rent, phone, streaming and anything that comes round.')}</div>
    <div class="card"><h3>📋 Your bills</h3>${(() => { const g = {}; allBills().forEach(b => { const k = b.category || 'Other'; const m = b.freq==='months' ? perMonth(b) : b.freq==='weekly' ? b.amount*52/12 : b.freq==='biweekly' ? b.amount*26/12 : b.freq==='twice' ? b.amount*2 : b.freq==='once' ? 0 : +b.amount; g[k] = (g[k]||0) + m; });
        const it = Object.entries(g).map(([l,v]) => ({l, v})).sort((a,b)=>b.v-a.v); return it.length ? `<div style="margin-bottom:12px">${donut(it, money(it.reduce((a,x)=>a+x.v,0),0), 'a month')}</div>` : ''; })()}${allBills().length ? allBills().map(b => `<div class="row">${catBadge(b.name+' '+(b.category||''))}<div class="grow"><div class="nm">${esc(b.name)}</div><div class="meta">${freqText(b)}${b.category?' · '+esc(b.category):''}</div></div><div class="amt">${money(+b.amount,2)}</div>${b.debt?'<span class="pill grey">from Debt</span>':`<button class="btn sm ghost" data-act="billModal" data-id="${b.id}">Edit</button>`}</div>`).join('') : `<div class="empty">Nothing here yet.</div>`}</div>
  </div>`;
}
function freqText(b){
  const o = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
  switch (b.freq){
    case 'monthly': return 'Monthly on the '+(+b.day>=31?'last day':o(+b.day||1));
    case 'twice': case 'semimonthly': return 'On the '+o(+b.day||1)+' and '+(+b.day2>=31?'last day':o(+b.day2||15));
    case 'weekly': return 'Every week ('+(b.anchor?DOW[pd(b.anchor).getDay()]:'')+')';
    case 'biweekly': return 'Every 2 weeks'+(b.anchor?' from '+short(b.anchor):'');
    case 'fourweekly': return 'Every 4 weeks'+(b.anchor?' from '+short(b.anchor):'');
    case 'months': return 'Every '+(+b.every||1)+' months'+(b.anchor?' from '+short(b.anchor):'')+(b.setAside?' · set aside monthly':'');
    case 'once': return 'Once on '+(b.anchor?nice(b.anchor):'');
    case 'irregular': return 'Irregular, logged by you';
  } return '';
}

/* ---------- DEBT ---------- */
function payoffPlan(extra = +S.debtExtraMonthly || 0){
  let ds_ = S.debts.map(d => ({id:d.id, name:d.name, bal:debtLeft(d), r:(+d.apr||0)/1200, min:+d.min||0})).filter(d => d.bal > 0.005);
  const order = () => ds_.filter(d => d.bal > 0.005).sort((a,b) => S.debtOrder === 'rate' ? b.r - a.r || a.bal - b.bal : a.bal - b.bal || b.r - a.r);
  const pool = ds_.reduce((a,d) => a + d.min, 0) + extra, done = {}; let interest = 0, m = 0;
  while (ds_.some(d => d.bal > 0.005) && m < 600){
    m++; let left = pool;
    ds_.forEach(d => { if (d.bal <= 0.005) return; const i = d.bal*d.r; interest += i; d.bal += i; const p = Math.min(d.bal, d.min); d.bal -= p; left -= p; });
    for (const d of order()){ if (left <= 0) break; const p = Math.min(d.bal, left); d.bal -= p; left -= p; }
    ds_.forEach(d => { if (d.bal <= 0.005 && !done[d.id]) done[d.id] = m; });
    if (pool <= 0) break;
  }
  return {months: m, interest, done, stuck: m >= 600};
}
function vDebt(){
  const plan = payoffPlan(), base = payoffPlan(0), total = S.debts.reduce((a,d) => a + debtLeft(d), 0);
  const when = n => { const d = new Date(); d.setMonth(d.getMonth()+n-1); return MON[d.getMonth()]+' '+d.getFullYear(); };
  const ordered = S.debts.slice().sort((a,b) => { const la = debtLeft(a) > 0.005, lb = debtLeft(b) > 0.005; if (la !== lb) return la ? -1 : 1; return S.debtOrder === 'rate' ? (+b.apr||0) - (+a.apr||0) || debtLeft(a) - debtLeft(b) : debtLeft(a) - debtLeft(b) || (+b.apr||0) - (+a.apr||0); });
  return `${head('Debt 💳', 'What you owe, which one to pay first, and the day you will be debt-free', `<button class="btn gold" data-act="debtModal">+ Add a debt</button>`)}
  ${S.debts.length ? `<div class="grid g4 keep" style="margin-bottom:18px">
    <div class="card kpi"><div class="k">💳 Total you owe</div><div class="v red-t">${money(total,0)}</div></div>
    <div class="card kpi"><div class="k">🎉 Debt-free date</div><div class="v gold-t">${plan.stuck?'-':when(plan.months)}</div><div class="tiny muted">${plan.stuck?'Raise a payment to finish':plan.months+' months'}</div></div>
    <div class="card kpi"><div class="k">📈 Interest still to pay</div><div class="v">${money(plan.interest,0)}</div></div>
    <div class="card kpi"><div class="k">💚 Paying extra saves you</div><div class="v green-t">${money(Math.max(0,base.interest-plan.interest),0)}</div><div class="tiny muted">in interest, vs paying only the minimum</div></div></div>
  <div class="grid g2"><div class="card"><h3>🔢 Pay in this order</h3>${ordered.map((d,i) => { const p = d.balance ? Math.min(100,(1-debtLeft(d)/d.balance)*100) : 0; return `<div class="row"><div class="pill gold">${i+1}</div><div class="grow"><div class="nm">${esc(d.name)}</div><div class="meta">${(+d.apr||0)}% interest a year · pay at least ${money(+d.min||0)} on the ${+d.day||1}${plan.done[d.id]?' · paid off '+when(plan.done[d.id]):''}</div><div class="bar green" style="margin-top:6px"><i style="width:${p}%"></i></div></div><div class="amt">${money(debtLeft(d),0)}</div><button class="btn sm" data-act="debtPay" data-id="${d.id}">I paid</button><button class="btn sm ghost" data-act="debtModal" data-id="${d.id}">Edit</button></div>`; }).join('')}</div>
   <div class="card"><h3>📉 Your plan</h3>${(() => { const a = payoffSeries(+S.debtExtraMonthly||0), b = payoffSeries(0); if (a.length < 2) return ''; const n = Math.max(a.length, b.length); const lab = []; for (let i = 0; i < n; i += Math.max(6, Math.ceil(n/5/6)*6)) { const d = new Date(); d.setMonth(d.getMonth()+i); lab.push([i, MON[d.getMonth()]+' '+String(d.getFullYear()).slice(2)]); }
      return lineChart([{pts:b, c:'var(--muted)', dash:true, w:2},{pts:a, c:'var(--gold)', fill:true}], {labels:lab, h:170}) + `<div class="legend"><span><i style="background:var(--gold)"></i>With your extra</span><span><i style="background:var(--muted)"></i>Minimums only</span></div>`; })()}
    <label class="lbl">Which debt to pay first?</label><div class="chipbar"><button class="btn ${S.debtOrder==='rate'?'gold':''}" data-act="order" data-v="rate">Highest interest first (saves most)</button><button class="btn ${S.debtOrder==='balance'?'gold':''}" data-act="order" data-v="balance">Smallest debt first (quick wins)</button></div>
    <label class="lbl">Extra I can pay each month (on top of the minimums)</label><div class="inl"><input class="inp" id="dextra" inputmode="decimal" value="${+S.debtExtraMonthly||0}"><button class="btn gold" data-act="saveExtra" style="flex:0 0 auto">Update</button></div>
    <div class="tiny muted" style="margin-top:12px">Your minimum payments show on your calendar and in Bills. Tick one there and what you owe goes down by itself. When a debt is paid off, its money moves to the next one.</div></div></div>`
  : illus('debt','Add a card or loan with its balance, rate and minimum payment. You get a payoff order and a debt-free date.')}`;
}

/* ---------- ENVELOPES ---------- */
function carryOf(e){
  if (!e.roll) return 0; const t = TODAY(), cur = t.slice(0,7); let [y, m] = (e.rollFrom || cur).split('-').map(Number); let carry = 0, n = 0;
  while ((y + '-' + pad(m)) < cur && n < 24){ const f = `${y}-${pad(m)}-01`, l = `${y}-${pad(m)}-${pad(dim(y, m-1))}`;
    carry += (+e.cap||0) - S.spends.filter(s => s.env === e.id && s.date >= f && s.date <= l).reduce((a,s) => a + s.amount, 0); m++; if (m > 12) { m = 1; y++; } n++; }
  return carry;
}
function vEnvelopes(){
  const t = TODAY(), first = t.slice(0,8)+'01';
  const sp = id => S.spends.filter(s => s.env === id && s.date >= first && s.date <= t).reduce((a,s)=>a+s.amount,0);
  const none = S.spends.filter(s => !s.env && s.date >= first && s.date <= t).reduce((a,s)=>a+s.amount,0);
  const capOf = e => (+e.cap||0) + carryOf(e);
  const caps = S.envelopes.reduce((a,e)=>a+capOf(e),0), spent = S.envelopes.reduce((a,e)=>a+sp(e.id),0);
  return `${head('Spending limits 🛒', 'How much you want to spend on each thing this month. A limit is a guide, not a wall.', `<button class="btn gold" data-act="envModal">+ Add a spending limit</button>`)}
  <div class="grid g3" style="margin-bottom:18px"><div class="card kpi"><div class="k">💰 Left in all limits</div><div class="v gold-t">${money(caps-spent,0)}</div></div><div class="card kpi"><div class="k">Spent</div><div class="v">${money(spent,0)}</div><div class="tiny muted">of ${money(caps,0)} in limits</div></div><div class="card kpi"><div class="k">No limit set</div><div class="v">${money(none,0)}</div></div></div>
  ${S.envelopes.length ? `<div class="grid g3">${S.envelopes.map(e => { const s = sp(e.id), cap = capOf(e), cr = carryOf(e), p = cap > 0 ? s/cap*100 : (s ? 101 : 0); return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="nm serif" style="font-size:19px">${esc(e.name)}</div><button class="btn sm ghost" data-act="envModal" data-id="${e.id}">Edit</button></div>
    <div class="bar ${p>100?'red':''}" style="margin:12px 0 8px"><i style="width:${Math.min(100,p)}%"></i></div><div class="small">${money(s,0)} of ${money(cap,0)} ${p>100?'<span class="pill red">over, that is ok, just notice it</span>':`<span class="muted">· ${money(cap-s,0)} left</span>`}</div>${e.roll ? `<div class="tiny ${cr<0?'red-t':'green-t'}" style="margin-top:6px">↻ ${cr>=0?'Carried over from last months: +':'Overspent before: '}${money(cr,0)}</div>` : ''}</div>`; }).join('')}</div>` : illus('envelopes','Groceries, fuel, eating out, fun money. Add a limit for each and pick one when you log a spend.')}`;
}

function modal(html){ document.getElementById('modal').innerHTML = html; document.getElementById('mask').classList.add('on'); setTimeout(() => { const f = document.querySelector('#modal input'); if (f) f.focus(); }, 50); }
function close(){ document.getElementById('mask').classList.remove('on'); }
function val(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function num(id){ const v = parseFloat(val(id).replace(/[^0-9.\-]/g,'')); return isNaN(v) ? 0 : v; }
let toastT; function toast(msg, undo){ const t = document.getElementById('toast'); t.innerHTML = esc(msg) + (undo ? ' <button id="undoB">Undo</button>' : ''); t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4200); if (undo) document.getElementById('undoB').onclick = () => { undo(); t.classList.remove('on'); }; }
function snapshot(){ return JSON.stringify(S); }
function restoreSnap(s){ S = JSON.parse(s); save(); render(); }
const opts = (list, cur) => list.map(([v,l]) => `<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('');
function freqFields(it, pay){
  const f = it.freq || (pay ? 'biweekly' : 'monthly');
  return `<label class="lbl">How often</label><select class="inp" id="f_freq" onchange="freqShow()">${opts(pay?FREQ_PAY:FREQ_BILL, f)}</select>
   <div id="fx_day"><div class="inl"><div><label class="lbl">Day of the month (31 = last day)</label><input class="inp" id="f_day" inputmode="numeric" value="${it.day||(pay?15:1)}"></div><div id="fx_day2"><label class="lbl">Second day</label><input class="inp" id="f_day2" inputmode="numeric" value="${it.day2||31}"></div></div></div>
   <div id="fx_anchor"><label class="lbl" id="l_anchor">${pay?'A real payday (any one)':'Next due date'}</label><input class="inp" id="f_anchor" type="date" value="${it.anchor||TODAY()}"></div>
   <div id="fx_every"><label class="lbl">Every how many months</label><input class="inp" id="f_every" inputmode="numeric" value="${it.every||6}"></div>`;
}
window.freqShow = function(){
  const f = val('f_freq'), show = (id, on) => { const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; };
  show('fx_day', ['monthly','twice','semimonthly'].includes(f)); show('fx_day2', ['twice','semimonthly'].includes(f));
  show('fx_anchor', ['weekly','biweekly','fourweekly','months','once'].includes(f)); show('fx_every', f === 'months'); show('fx_setaside', f === 'months');
};
function readFreq(o){ o.freq = val('f_freq'); o.day = Math.max(1, Math.min(31, num('f_day')||1)); o.day2 = Math.max(1, Math.min(31, num('f_day2')||31)); o.anchor = val('f_anchor'); o.every = Math.max(1, Math.min(24, num('f_every')||1)); return o; }

function freePerPaycheck(){

function makeICS(){

  const ev = (uidv, start, title, rrule, alarm) => { L.push('BEGIN:VEVENT','UID:'+uidv+'@sheetsingold','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+d8(start),'DTEND;VALUE=DATE:'+d8(addD(start,1)),'SUMMARY:'+title.replace(/[,;]/g,' ')); if (rrule) L.push('RRULE:'+rrule);
    if (alarm) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title.replace(/[,;]/g,' '),'TRIGGER:-PT15H','END:VALARM'); L.push('END:VEVENT'); };
  const t = TODAY(), rule = (it) => {
    const md = d => +d >= 31 ? -1 : +d;
    switch (it.freq) { case 'monthly': return [[occ(it,t,addD(t,62))[0], 'FREQ=MONTHLY;BYMONTHDAY='+md(it.day||1)]];
      case 'twice': case 'semimonthly': return [[occ({freq:'monthly',day:it.day||1},t,addD(t,62))[0],'FREQ=MONTHLY;BYMONTHDAY='+md(it.day||1)],[occ({freq:'monthly',day:it.day2||15},t,addD(t,62))[0],'FREQ=MONTHLY;BYMONTHDAY='+md(it.day2||15)]];
      case 'weekly': return [[occ(it,t,addD(t,14))[0],'FREQ=WEEKLY']]; case 'biweekly': return [[occ(it,t,addD(t,28))[0],'FREQ=WEEKLY;INTERVAL=2']]; case 'fourweekly': return [[occ(it,t,addD(t,56))[0],'FREQ=WEEKLY;INTERVAL=4']];
      case 'months': return [[occ(it,t,addD(t,800))[0],'FREQ=MONTHLY;INTERVAL='+(it.every||1)]]; case 'once': return it.anchor >= t ? [[it.anchor,null]] : []; } return []; };

/* ---------- example + onboarding ---------- */
function example(){
  const t = TODAY(), s = blank(); s.example = true; s.setupDone = true; s.name = 'Sam Carter'; s.profile = {goal:'overdraft', household:'Just me', week:'Monday', color:'#C9A54C', avatar:'', bio:''}; s.title = 'My calm money plan'; s.start = addD(t, -75);
  const lastFri = (() => { let d = t; while (pd(d).getDay() !== 5) d = addD(d, -1); return d; })();
  s.paychecks = [{id:'p1', name:'Main wage', amount:1850, freq:'biweekly', anchor:lastFri, weekendEarly:true}]; s.accounts = [{id:'a1', name:'Rainy day savings', type:'savings', balance:2150}]; s.toured = true;
  s.balance = 1325.40; s.balanceDate = addD(lastFri, -1); s.balanceTs = 0; s.buffer = 100;   // balance typed the day before the last payday
  const m = (name, amount, day, cat, extra={}) => Object.assign({id:uid(), name, amount, freq:'monthly', day, category:cat, paid:{}}, extra);
  s.bills = [m('Rent',1150,1,'Home'), m('Phone',45,12,'Phone'), m('Internet',55,18,'Home'), m('Electric',85,22,'Home'), Object.assign(m('Streaming',16,9,'Fun'),{sub:true}), Object.assign(m('Gym',30,4,'Health'),{sub:true}), Object.assign(m('Music',11,14,'Fun'),{sub:true}),
    Object.assign(m('Car insurance',372,1,'Car'), {freq:'months', every:6, anchor:addD(t, 50), setAside:true})];
  // tick everything already due
  s.bills.forEach(b => occ(b, s.start, addD(t,-1)).forEach(d => b.paid[d] = true));
  s.envelopes = [{id:'e1',name:'Groceries',cap:560},{id:'e2',name:'Fuel',cap:180},{id:'e3',name:'Eating out',cap:140},{id:'e4',name:'Fun money',cap:90, roll:true, rollFrom:ds(new Date(pd(t).getFullYear(), pd(t).getMonth()-1, 1, 12)).slice(0,7)}];
  s.goals = [{id:'g1',name:'Emergency fund',target:3000,saved:1240,monthly:150,inSafe:true},{id:'g2',name:'Summer trip',target:1200,saved:380,monthly:100,inSafe:true}];
  s.debts = [{id:'d1',name:'Visa card',balance:2400,apr:22.9,min:65,day:20,paid:{}},{id:'d2',name:'Car loan',balance:6900,apr:7.4,min:210,day:6,paid:{}}];
  s.debts.forEach(d => occ({freq:'monthly', day:d.day}, s.start, addD(t,-1)).forEach(x => d.paid[x] = true));
  const notes = [['Supermarket','e1'],['Coffee','e3'],['Fuel','e2'],['Lunch out','e3'],['Market','e1'],['Cinema','e4']];
  for (let i = 70; i >= 0; i--) { if (i > 0 && (i % 6 === 3)) continue; const d = addD(t, -i); const n = i === 0 ? 2 : 1 + (i % 2); for (let k = 0; k < n; k++){ const [note, env] = notes[(i*3+k) % notes.length]; const base = {e1:31,e2:27,e3:8,e4:12}[env]; s.spends.push({id:uid(), date:d, amount:Math.round(base*(0.7+((i*7+k*3)%10)/12)*100)/100, note, env}); } }
  s.income = [{id:uid(), date:addD(t,-5), amount:60, note:'Refund'}];
  s.debtExtraMonthly = 50; s.wins = [{id:'w1', date:addD(t,-20), text:'Every bill paid in '+MONL[(pd(t).getMonth()+11)%12]}, {id:'w2', date:addD(t,-9), text:'Weekly check-in done for the week of '+short(addD(weekStart(t),-7))}]; s.dump = [{id:'b1', text:'Ask landlord about the lease renewal', date:t}]; s.lastOpenPrev = t; return s;
}

function shell(inner){ close(); document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">${inner}</div>`; }

  return `<div class="avatar ${big?'lg':''}" style="background:${/^#[0-9A-Fa-f]{6}$/.test(x.color||'')?x.color:'var(--gold)'};color:var(--onacc)">${esc(init)}</div>`; }
function whoScreen(){
  S = null; cryptoKey = null; document.documentElement.dataset.theme = 'midnight';
  shell(`<div class="card" style="width:min(560px,100%);text-align:center"><img src="icon-192.png" alt="" style="width:64px;height:64px;border-radius:16px"><h2 class="serif" style="font-size:28px;margin:10px 0 4px">Who is using the planner?</h2>

      <button class="sw" data-who="__add" style="text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px"><div class="avatar lg" style="background:var(--card);color:var(--gold);border-style:dashed">+</div><b>Add a person</b><small>New empty planner</small></button></div></div>`);
}
let pinTries = 0, pinWait = 0;
function lockScreen(id){
  const x = people.list.find(y => y.id === id) || me(); S = null; cryptoKey = null; document.documentElement.dataset.theme = 'midnight';
  shell(`<div class="card" style="width:min(420px,100%);text-align:center"><div style="display:flex;justify-content:center">${personAvatar(x, true)}</div><h2 class="serif" style="font-size:26px;margin:12px 0 4px">${esc(x.name || 'Your planner')}</h2>
    <div class="small muted">This planner is locked with a PIN.</div>
    <input class="inp" id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Enter PIN" style="text-align:center;font-size:24px;letter-spacing:8px;margin-top:16px">
    <div id="pinMsg" class="tiny red-t" style="min-height:18px;margin-top:6px"></div>
    <button class="btn gold" style="width:100%;margin-top:6px" data-unlock="${x.id}">Unlock</button>
    <div class="chipbar" style="justify-content:center;margin-top:12px">${people.list.length > 1 ? '<button class="btn sm ghost" data-who="__pick">Switch person</button>' : ''}<button class="btn sm ghost" data-who="__forgot">Forgot PIN?</button></div></div>`);
  setTimeout(() => { const i = document.getElementById('pinIn'); if (i) i.focus(); }, 50);
}
async function unlock(id){
  const x = people.list.find(y => y.id === id); const msg = document.getElementById('pinMsg'); const pin = (document.getElementById('pinIn')||{}).value || '';
  if (Date.now() < pinWait) { msg.textContent = 'Too many tries. Wait a few seconds.'; return; }
  if (!/^\d{4,8}$/.test(pin)) { msg.textContent = 'Your PIN is 4 to 8 numbers.'; return; }
  msg.textContent = 'Unlocking...';
  try { const key = await deriveKey(pin, x.salt); const raw = localStorage.getItem(keyFor(id)); const d = raw ? JSON.parse(await decryptText(raw, key)) : null;
    people.active = id; savePeople(); cryptoKey = key; pinTries = 0; S = d ? clean(d) : null; afterOpen();
  } catch(e){ pinTries++; if (pinTries >= 5) { pinWait = Date.now() + 30000; pinTries = 0; } msg.textContent = 'That PIN did not work.'; const i = document.getElementById('pinIn'); if (i) { i.value = ''; i.focus(); } }
}
function openPerson(id){
  const x = people.list.find(y => y.id === id); if (!x) return whoScreen(); people.active = id; savePeople(); cryptoKey = null;
  if (x.locked && isEncrypted(localStorage.getItem(keyFor(id)) || '')) return lockScreen(id);
  if (x.locked) { x.locked = false; delete x.salt; savePeople(); }   // PIN set but nothing stored yet
  S = load(); afterOpen();
}
let bootView = null;
function afterOpen(){ view = bootView || 'today'; bootView = null; if (!S || !S.setupDone) { onboard(); return; } S.lastOpenPrev = S.lastOpen || TODAY(); S.lastOpen = TODAY(); save(true); render(); abInit(); welcomeApp(); }
function lockNow(){ if (!me().locked) return; save(true); setTimeout(() => lockScreen(people.active), 50); }
document.addEventListener('click', e => {
  const w = e.target.closest('[data-who]'); const u = e.target.closest('[data-unlock]');
  if (u) { unlock(u.dataset.unlock); return; }
  if (!w) return; const id = w.dataset.who;
  if (id === '__add') return addPerson();
  if (id === '__pick') return whoScreen();
  if (id === '__forgot') return modal(`<h2>Forgot your PIN?</h2><div class="small" style="line-height:1.55">Your numbers are encrypted with your PIN, so nobody (not even us) can open them without it. That is what keeps them private.</div>
      <div class="tip">${ico('shield')}<div>If you have a backup file, you can remove this planner and restore the backup. Otherwise keep trying: after 5 tries there is a short wait.</div></div>
      <div class="acts"><button class="btn red" data-act="forgetPerson">Remove this planner</button><button class="btn gold" data-act="close">Try again</button></div>`);
  openPerson(id);
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pinIn') { const u = document.querySelector('[data-unlock]'); if (u) unlock(u.dataset.unlock); } });
function addPerson(){
  modal(`<h2>Add a person</h2><div class="small muted">They get their own empty planner on this device. Nobody else's numbers are shown to them.</div><label class="lbl">Their name</label><input class="inp" id="np_name" maxlength="40" placeholder="First name">
    <div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="addPersonSave">Create planner</button></div>`);
}
/* auto-lock after 5 minutes away */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hiddenAt = Date.now(); else if (S && me().locked && hiddenAt && Date.now() - hiddenAt > 5*60*1000) lockNow(); });

/* ---------- backups: file text, auto-backup (desktop), reminders ---------- */
async function backupText(){ const data = JSON.stringify(Object.assign({}, S, {kind:'sig-budget'}), null, 1); return me().locked && cryptoKey ? encryptText(data, cryptoKey, me().salt) : data; }
function markBackedUp(){ if (!S) return; S.lastBackup = TODAY(); save(true); }
const FSA = typeof window.showSaveFilePicker === 'function';
let abHandle = null, abState = 'off', abTimer = null;
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('sig-budget', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise(res => { const t = db.transaction('kv','readwrite'); v === undefined ? t.objectStore('kv').delete(k) : t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); }); }
async function abInit(){ if (!FSA) return; try { abHandle = await idbGet('ab:' + people.active); if (!abHandle) { abState = 'off'; return; } const p = await abHandle.queryPermission({mode:'readwrite'}); abState = p === 'granted' ? 'on' : 'paused'; if (view === 'today' || view === 'settings') render(); } catch(e){ abState = 'off'; } }
async function abOn(){ try { const nm = (S.name || 'my').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'my';
    abHandle = await showSaveFilePicker({suggestedName:`budget-planner-${nm}-backup.json`, types:[{description:'Budget Planner backup', accept:{'application/json':['.json']}}]});
    await idbSet('ab:' + people.active, abHandle); abState = 'on'; await abWrite(); render(); toast('Auto-backup is on. Every change is saved to that file.'); } catch(e){ if (e && e.name !== 'AbortError') toast('Auto-backup could not start here. Use Download a backup instead.'); } }
async function abResume(){ try { const p = await abHandle.requestPermission({mode:'readwrite'}); abState = p === 'granted' ? 'on' : 'paused'; if (abState === 'on') await abWrite(); render(); } catch(e){} }
async function abOff(){ await idbSet('ab:' + people.active, undefined); abHandle = null; abState = 'off'; render(); toast('Auto-backup turned off. Your file is still where you saved it.'); }
function autoBackupSoon(){ if (abState !== 'on') return; clearTimeout(abTimer); abTimer = setTimeout(abWrite, 1500); }
async function abWrite(){ if (!abHandle || !S) return; try { const w = await abHandle.createWritable(); await w.write(await backupText()); await w.close(); markBackedUp(); } catch(e){ abState = 'paused'; } }
function backupCard(){
  if (!S || S.example) return '';
  if (abState === 'on') return '';
  if (abState === 'paused') return `<div class="install hide-focus">${ico('shield')}<div class="grow"><b>Auto-backup is paused</b><div class="tiny muted">Your browser asks again after a restart. One click and it carries on saving.</div></div><button class="btn gold" data-act="abResume">Turn it back on</button></div>`;
  const has = S.spends.length + S.bills.length + S.goals.length > 3, age = S.lastBackup ? diff(TODAY(), S.lastBackup) : 999;
  if (!has || age < 7 || (S.backupSnooze && diff(TODAY(), S.backupSnooze) < 3)) return '';
  return `<div class="install hide-focus">${ico('shield')}<div class="grow"><b>Keep your numbers safe</b><div class="tiny muted">${S.lastBackup ? 'Last backup '+age+' days ago.' : 'No backup yet.'} If this app is ever removed or the phone is changed, a backup brings everything back.</div></div>
    ${FSA ? '<button class="btn gold" data-act="abOn">Turn on auto-backup</button>' : '<button class="btn gold" data-act="shareBackup">Save a backup</button>'}<button class="btn sm ghost" data-act="backupLater">Not now</button></div>`;
}

}

  ['Do I have to import from my bank?', 'No. It is completely optional and most people never use it. If you want to, download a CSV from your online banking and choose it under Profile & settings. The file is read on this device only and never sent anywhere.']]],
 ['Installing the app', [
  ['How do I put it on my phone?', 'iPhone: open in Safari, tap Share, then Add to Home Screen. Android: open in Chrome, tap the menu, then Install app. Computer: click Install app in the sidebar.'],
  ['Does it work without internet?', 'Yes. Once opened or installed, it works offline.'],
  ['How do updates arrive?', 'Automatically. The next time you open the app online, you get the newest version. Your numbers are not touched.']]]];
function vHelp(){
  return `${head('Help & FAQ ❓', 'Short answers in plain words', `<button class="btn gold" data-act="tour">${ico('spark')} Show me around</button>`)}
  <div class="card" style="margin-bottom:18px"><input class="inp" id="faqQ" placeholder="Search, for example: backup, PIN, payday" oninput="faqFilter(this.value)"></div>
  <div class="grid g2">${FAQ.map(([sec, qs]) => `<div class="card faq"><h3>${sec}</h3>${qs.map(([q,a]) => `<details data-q="${esc((q+' '+a).toLowerCase())}"><summary>${esc(q)}</summary><div>${esc(a)}</div></details>`).join('')}</div>`).join('')}</div>
  <div class="card" style="margin-top:18px"><h3>Still stuck?</h3><div class="small" style="line-height:1.55">Message the seller through Etsy (You › Purchases › your order › Message seller). A real person answers.</div></div>`;
}
window.faqFilter = q => { q = q.toLowerCase().trim(); document.querySelectorAll('.faq details').forEach(d => { const hit = !q || d.dataset.q.includes(q); d.style.display = hit ? '' : 'none'; if (q && hit) d.open = true; }); };
/* ---------- guided tour ---------- */
const TOUR = [
  ['.hero', 'Your one number', 'This is how much you can spend today and still pay every bill before payday. It changes as you log spending.'],
  ['#amt', 'Log a spend in seconds', 'Tap a quick amount or type something like "12 coffee" and press Enter. That is the daily habit.'],
  ['.next', 'Your next step', 'One thing at a time. When a bill is due or your balance needs a check, it shows up here.'],
  ['.side .nav[data-go=bills], .bnav [data-go=bills]', 'Bills', 'Tick bills as they go out. Anything still unpaid is held back from safe to spend.'],
  ['[data-act=afford]', 'Can I afford it?', 'Thinking of buying something? Type the price and get a straight answer.'],
  ['.side .brand, .bnav [data-go=more]', 'Profile, backups and more', 'Add a PIN, keep a backup, change colours and text size. Help & FAQ is here too.']];
function tour(i){
  document.querySelectorAll('.tour-mask,.tour-spot,.tour-tip').forEach(x => x.remove()); if (i >= TOUR.length) { S.toured = true; save(true); return; }
  if (view !== 'today') { view = 'today'; render(); }
  const [sel, t, p] = TOUR[i]; const el = [...document.querySelectorAll(sel)].find(x => x.offsetParent !== null); if (!el) return tour(i + 1);
  el.scrollIntoView({block:'center'}); setTimeout(() => { const r = el.getBoundingClientRect(), pad = 8;
    const mask = document.createElement('div'); mask.className = 'tour-mask'; const spot = document.createElement('div'); spot.className = 'tour-spot';
    Object.assign(spot.style, {left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
    const tip = document.createElement('div'); tip.className = 'tour-tip';
    tip.innerHTML = `<div class="tiny gold-t" style="font-weight:800;letter-spacing:1px">${i+1} OF ${TOUR.length}</div><h4>${t}</h4><p>${p}</p><div class="acts"><button class="btn sm ghost" id="tSkip">Skip tour</button><button class="btn sm gold" id="tNext">${i === TOUR.length-1 ? 'Done' : 'Next'}</button></div>`;
    document.body.append(mask, spot, tip);
    const below = r.bottom + 14 + 190 < innerHeight; tip.style.top = (below ? r.bottom + 14 : Math.max(12, r.top - 14 - tip.offsetHeight)) + 'px';
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 12, Math.max(12, r.left)) + 'px';
    document.getElementById('tNext').onclick = () => tour(i + 1); document.getElementById('tSkip').onclick = () => tour(TOUR.length); mask.onclick = () => tour(i + 1);
  }, 220);
}

/* ---------- keep the screen current (new day, new greeting) ---------- */
let lastRenderKey = '';
setInterval(() => { if (!S || !S.setupDone || document.getElementById('mask').classList.contains('on')) return; const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  const k = TODAY() + '|' + new Date().getHours(); if (lastRenderKey && k !== lastRenderKey) render(); lastRenderKey = k; }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && S.setupDone && !document.getElementById('mask').classList.contains('on')) render(); });
/* ---------- ask the browser to keep data (not auto-clear) ---------- */
let storageKept = null;
async function keepStorage(){ try { if (navigator.storage && navigator.storage.persist) { storageKept = await navigator.storage.persisted() || await navigator.storage.persist(); } } catch(e){} }
keepStorage();

/* ---------- boot ---------- */
const QS = new URLSearchParams(location.search);
if (QS.has('example') && !localStorage.getItem(keyFor(people.active)) && !me().locked) { S = example(); if (QS.get('theme')) S.theme = QS.get('theme'); save(true); }   // never overwrites a real planner
if (QS.get('view') && NAV.some(n => n[0] === QS.get('view'))) { view = QS.get('view'); bootView = view; }
const GO_LOG = QS.get('go') === 'log';
if (people.list.length > 1 && !QS.has('example')) whoScreen();
else if (me().locked && isEncrypted(localStorage.getItem(keyFor(people.active)) || '')) lockScreen(people.active);
else if (!S || !S.setupDone) onboard();
else { afterOpen(); if (GO_LOG) A.logModal(); }
/* screenshot helper: only on example data, never touches a real planner */
if (S && S.example && QS.get('show')) setTimeout(() => { const w = QS.get('show');
  if (w === 'afford') { A.afford(); document.getElementById('af_amt').value = QS.get('amt') || '600'; document.getElementById('af_name').value = QS.get('item') || 'New headphones'; A.affordCheck(); }
  if (w === 'explain') A.explain();
  if (w === 'tour') tour(+QS.get('step') || 0);
  if (w === 'lock') lockScreen(people.active);
  if (w === 'who') { people.list.push({id:'demo2', name:'Ayesha', color:'#7C63C9', locked:true}, {id:'demo3', name:'Omar', color:'#4E8B6E', locked:false}); whoScreen(); }
  if (w === 'install') A.installHelp();
  if (w === 'pin') A.pinModal();
  if (w === 'log') { A.logModal(); document.getElementById('m_amt').value = '12.50'; document.getElementById('m_note').value = 'Coffee with Mia'; }
}, 400);
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !QS.has('show')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
